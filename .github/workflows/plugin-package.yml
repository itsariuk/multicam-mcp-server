name: Build desktop plugin
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'multicam_*.py'
      - 'multicam_*.html'
      - 'plugins/**'
      - 'scripts/build_plugin.py'
      - '.github/workflows/plugin-package.yml'
      - 'pyproject.toml'
      - 'uv.lock'
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev --python 3.13
      - run: uv pip install pyinstaller==6.22.3
      - run: uv run python scripts/build_plugin.py
      - run: node scripts/check_phone_page.mjs
      - name: Protocol checks (Linux)
        if: runner.os == 'Linux'
        run: uv run pytest -q test_plugin.py test_phone_cameras.py
      - uses: actions/upload-artifact@v4
        with:
          name: multicam-${{ runner.os }}-${{ runner.arch }}
          path: dist/multicam-*.zip
          if-no-files-found: error
