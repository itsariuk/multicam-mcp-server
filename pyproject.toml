[project]
name = "multicam-mcp-server"
version = "0.1.3"
description = "Allow LLMs to capture images from cameras, video streams, and phone browsers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Groundlight AI" }, { name = "Ilya Tsaryuk" }]
license = { text = "Apache-2.0" }
dependencies = [
    "mcp[cli]",
    "framegrab>=0.11.1",
    "pypylon",
    "streamlink",
    "uvicorn",
    "starlette",
    "cryptography>=42",
    "platformdirs",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
]

[project.optional-dependencies]
dev = ["ruff>=0.7.3", "pytest"]

[project.scripts]
multicam-mcp-server = "multicam_mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "multicam_mcp_server.py",
    "multicam_mcp_phone.py",
    "multicam_mcp_phone.html",
]
