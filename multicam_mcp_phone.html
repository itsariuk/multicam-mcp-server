<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>multicam phone camera</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 16px/1.4 system-ui, sans-serif; margin: 0 auto; padding: 16px; max-width: 480px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  label { display: block; margin: 12px 0 4px; }
  input, select, button { font: inherit; font-size: 16px; min-height: 44px; box-sizing: border-box; }
  input, select { width: 100%; padding: 8px; }
  .row { display: flex; gap: 8px; margin: 16px 0; }
  .row button { flex: 1; padding: 8px 16px; }
  #status { min-height: 1.4em; margin: 12px 0; }
  video { width: 100%; background: #000; border-radius: 8px; }
</style>
</head>
<body>
<h1>Phone camera</h1>
<p>Ask Codex to open joining, then connect within 60 seconds. New phones need the PIN shown separately on the computer.</p>
<p>The preview stays on this phone. One photo is sent only when Codex requests a snapshot.</p>

<label for="name">Camera name</label>
<input id="name" maxlength="40" autocomplete="off" autocapitalize="off" placeholder="left bench">

<label for="pin">PIN <small>(shown on the computer; required when joining)</small></label>
<input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code">

<label for="device">Camera</label>
<select id="device" disabled><option>Available after Start</option></select>

<div class="row">
  <button id="start" type="button">Start</button>
  <button id="stop" type="button" disabled>Stop camera</button>
  <button id="torch" type="button" aria-pressed="false" hidden>Torch</button>
</div>

<p id="status" role="status" aria-live="polite"></p>
<p id="diagnostics"><small>Timing appears here while the camera is live.</small></p>
<video id="video" playsinline autoplay muted></video>

<script>
const NAME_RE = /^[A-Za-z0-9][A-Za-z0-9 _-]{0,39}$/;
const POLL_EVERY_MS = 500;
const PHOTO_QUALITY = 0.92;
const $ = id => document.getElementById(id);
const nameInput = $('name'), pinInput = $('pin'), deviceSelect = $('device'), startBtn = $('start'),
      torchBtn = $('torch'), video = $('video');
const canvas = document.createElement('canvas');
let stream = null, track = null, imageCapture = null, photoSettings = null;
let running = false, photos = 0, name = '', cameraToken = '';
let lastFrameTime = -1;
let session = 0;

const status = text => { $('status').textContent = text; };
// localStorage can throw (private mode, blocked site data); the page must work without it.
const load = key => { try { return localStorage.getItem(key); } catch (e) { return null; } };
const store = (key, value) => { try { localStorage.setItem(key, value); } catch (e) {} };
const forget = key => { try { localStorage.removeItem(key); } catch (e) {} };
// Session token stays in memory and is never placed in localStorage or a URL.
const authHeaders = () => cameraToken ? {authorization: 'Bearer ' + cameraToken} : {};

nameInput.value = load('name') || '';
// Pairing credentials are never accepted from a URL.
if (location.hash) history.replaceState(null, "", location.pathname + location.search);
if (!window.isSecureContext || !navigator.mediaDevices) {
  status('This page needs HTTPS. Open the https:// address and accept the certificate warning.');
  startBtn.disabled = true;
}

function stopAll() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = track = null;
  imageCapture = photoSettings = null;
  video.srcObject = null;
  torchBtn.hidden = true;
  deviceSelect.disabled = true;
}

// The one way out of a live session: stop sending, free the camera, and say why.
function halt(message) {
  running = false;
  $('stop').disabled = true;
  stopAll();
  startBtn.disabled = false;
  nameInput.disabled = false;
  pinInput.disabled = false;
  status(message);
}

async function openCamera(deviceId) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  // Drop the old picture now: a stopped stream leaves its last frame in the <video>, and
  // the send loop must never upload that as if it were live.
  video.srcObject = null;
  // Ask for the largest uncropped camera mode. `resizeMode: none` is exact on purpose:
  // silently accepting `crop-and-scale` would lose the sensor edges. Width and height
  // are landscape-oriented constraints; Chrome rotates them with a portrait phone.
  const size = {
    width: {ideal: 4080},
    height: {ideal: 3064},
    resizeMode: {exact: 'none'},
  };
  try {
    stream = await navigator.mediaDevices.getUserMedia(
      {video: deviceId ? {deviceId: {exact: deviceId}, ...size} : {facingMode: 'environment', ...size}});
  } catch (e) {
    // A remembered deviceId can be stale (other browser profile, cleared site data).
    if (!deviceId || (e.name !== 'OverconstrainedError' && e.name !== 'NotFoundError')) throw e;
    stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment', ...size}});
  }
  video.srcObject = stream;
  await video.play();
  track = stream.getVideoTracks()[0];
  if ('ImageCapture' in window) {
    try {
      imageCapture = new ImageCapture(track);
      const photoCaps = await imageCapture.getPhotoCapabilities();
      photoSettings = {
        imageWidth: photoCaps.imageWidth.max,
        imageHeight: photoCaps.imageHeight.max,
      };
    } catch (e) {
      imageCapture = photoSettings = null;
    }
  }
  const opened = track;
  // Fires when the camera is taken away (another app, permission revoked), not on our own stop().
  track.onended = () => { if (running && track === opened) halt('The camera stopped. Tap Start to try again.'); };
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  torchBtn.hidden = !('torch' in caps);
  torchBtn.setAttribute('aria-pressed', 'false');
  torchBtn.textContent = 'Torch';
}

async function listCameras() {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
  const active = track.getSettings().deviceId;
  deviceSelect.replaceChildren(...devices.map((d, i) => {
    const option = new Option(d.label || 'Camera ' + (i + 1), d.deviceId);
    option.selected = d.deviceId === active;
    return option;
  }));
  deviceSelect.disabled = devices.length < 2;
}

async function register() {
  // A new session requires the separately entered PIN during an open pairing window.
  const res = await fetch('/api/cameras', {
    method: 'POST', headers: {'content-type': 'application/json', ...authHeaders()},
    body: JSON.stringify({name, pin: pinInput.value.trim() || undefined})});
  const body = await res.json().catch(() => ({}));
  if (res.ok) {
    if (body.token) cameraToken = body.token;
    return null;
  }
  if (res.status === 401) forget('token:' + name);
  return body.error || 'Could not register (' + res.status + ').';
}

function requestWakeLock() {
  if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(() => {});
}

async function start() {
  name = nameInput.value.trim();
  cameraToken = '';
  forget('token:' + name); // discard credentials left by older versions
  if (!NAME_RE.test(name)) { status('Name must be 1-40 letters, digits, spaces, _ or -.'); return; }
  // Single-shot: a second tap would re-assign srcObject and abort the first play().
  startBtn.disabled = true;
  nameInput.disabled = true;
  pinInput.disabled = true;
  status('Starting camera…');
  // Chrome gives the camera to one tab at a time; a second tab just waits, silently.
  const hint = setTimeout(() => status('Waiting for the camera… is this page open in another tab?'), 5000);
  try {
    await openCamera(load('deviceId'));
    clearTimeout(hint);
    await listCameras();
    const error = await register();
    if (error) throw new Error(error);
    store('name', name);
    requestWakeLock();
    photos = 0;
    lastFrameTime = -1;
    running = true;
    $('stop').disabled = false;
    loop(++session);
  } catch (e) {
    clearTimeout(hint);
    halt(e.name === 'NotAllowedError' ? 'Camera permission was denied. Allow it in the browser settings and tap Start.'
       : e.name === 'Error' ? e.message : e.name + ': ' + e.message);
  }
}

// Draw the current video frame, scaled so its long edge is at most longEdge (0 = full size).
function capture(longEdge, quality) {
  const scale = longEdge ? Math.min(1, longEdge / Math.max(video.videoWidth, video.videoHeight)) : 1;
  const width = Math.round(video.videoWidth * scale);
  const height = Math.round(video.videoHeight * scale);
  // Assigning either dimension clears the canvas and reallocates its backing store. Most
  // captures have the same dimensions, so only resize when the dimensions really change.
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
}

// Prefer the camera's native still-photo path: unlike the video track copied by the
// canvas, it can expose the sensor's full still-image aspect and maximum dimensions.
// Browsers without ImageCapture keep the existing full-video-frame fallback.
async function capturePhoto() {
  if (imageCapture) {
    try { return await imageCapture.takePhoto(photoSettings || undefined); }
    catch (e) {}
  }
  return capture(0, PHOTO_QUALITY);
}

// Poll only for small request metadata. No background images are encoded or uploaded.
async function responseError(res) {
  if (res.ok) return false;
  const body = await res.json().catch(() => ({}));
  if (res.status === 401) { forget('token:' + name); cameraToken = ''; }
  if ([401, 403, 404, 410].includes(res.status)) {
    halt(body.error || 'Ask Codex to open joining again, then tap Start.');
  } else {
    status(body.error || 'Request failed (' + res.status + ').');
  }
  return true;
}

async function loop(mySession) {
  if (!running || mySession !== session) return;
  try {
    const base = '/api/cameras/' + encodeURIComponent(name);
    const res = await fetch(base + '/request', {headers: authHeaders(), cache: 'no-store'});
    if (!await responseError(res)) {
      const request = await res.json();
      if (request.request_id && video.videoWidth && document.visibilityState === 'visible') {
        // A frozen local preview must never be presented as a fresh camera capture.
        if (video.currentTime === lastFrameTime) {
          status('No fresh camera frame. Keep this page visible and check the camera.');
        } else {
          lastFrameTime = video.currentTime;
          const started = performance.now();
          const photo = await capturePhoto();
          if (!running || mySession !== session) return;
          const captured = performance.now();
          if (photo) {
            const reply = await fetch(base + '/frame', {
              method: 'POST',
              headers: {...authHeaders(), 'x-capture-request': request.request_id},
              body: photo,
            });
            if (!await responseError(reply)) {
              photos++;
              status('Connected as "' + name + '" · ' + photos + ' requested photos sent.');
              $('diagnostics').textContent = 'Capture ' + Math.round(captured - started) +
                'ms · upload ' + Math.round(performance.now() - captured) + 'ms';
            }
          }
        }
      } else if (!request.request_id) {
        status('Connected as "' + name + '" · waiting for Codex. Preview stays on this phone.');
      }
    }
  } catch (e) {
    status('Connection interrupted. No photos are being sent. (' + e.message + ')');
  }
  if (running && mySession === session) setTimeout(() => loop(mySession), POLL_EVERY_MS);
}

startBtn.addEventListener('click', start);
$('stop').addEventListener('click', async () => {
  const headers = authHeaders();
  const cameraName = name;
  session++;
  halt('Camera stopped. Ask Codex to open joining before connecting again.');
  cameraToken = '';
  try { await fetch('/api/cameras/' + encodeURIComponent(cameraName), {method: 'DELETE', headers}); }
  catch (e) { /* The local camera is stopped even if the network is unavailable. */ }
});

deviceSelect.addEventListener('change', async () => {
  store('deviceId', deviceSelect.value);
  try { await openCamera(deviceSelect.value); }
  catch (e) { halt('Could not switch camera (' + e.name + '). Tap Start to try again.'); }
});

torchBtn.addEventListener('click', async () => {
  const on = torchBtn.getAttribute('aria-pressed') !== 'true';
  try {
    await track.applyConstraints({advanced: [{torch: on}]});
    torchBtn.setAttribute('aria-pressed', String(on));
    torchBtn.textContent = on ? 'Torch on' : 'Torch';
  } catch (e) {
    torchBtn.hidden = true;
  }
});

// A screen wake lock is dropped whenever the page is hidden; take it again on return.
document.addEventListener('visibilitychange', () => {
  if (running && document.visibilityState === 'visible') requestWakeLock();
});
</script>
</body>
</html>
